<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" role="img" aria-labelledby="title desc">
  <title id="title">The little Potato</title>
  <desc id="desc">A potato engineer finds a wandering bug, patches it, and turns the build green. A twelve-second animated miniature, made with SVG and CSS.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101317"/><stop offset="1" stop-color="#090b0d"/></linearGradient>
    <linearGradient id="case" x2="0" y2="1"><stop stop-color="#2a3036"/><stop offset="1" stop-color="#15191d"/></linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#ffe0a2"/><stop offset=".55" stop-color="#dfac62"/><stop offset="1" stop-color="#b77a3c"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#e6c38a" stop-opacity=".07"/><stop offset="1" stop-color="#e6c38a" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".6" fill="#879098" opacity=".17"/></pattern>
    <clipPath id="bounds"><rect x="1" y="1" width="838" height="318" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .label { fill: #90989f; font-size: 10px; letter-spacing: 1.5px; }
    .code { font-size: 12px; fill: #bbc4cb; }
    .cycle { animation-duration: 12s; animation-iteration-count: infinite; }
    .scan { animation-name: scan; }
    .found { opacity: 0; animation-name: found; }
    .patch { opacity: 0; animation-name: patch; }
    .pass { opacity: 0; animation-name: pass; }
    .cursor { animation: cursor 1s steps(1) infinite; }
    .bug { animation-name: bug; animation-timing-function: cubic-bezier(.65,0,.35,1); }
    .legs { animation: legs .22s steps(2) infinite; }
    .engineer { animation-name: engineer; animation-timing-function: cubic-bezier(.65,0,.35,1); }
    .body { animation: breathe 3s ease-in-out infinite; transform-origin: 0 212px; }
    .eyes { animation: blink 4s infinite; transform-origin: 0 176px; }
    .hand { animation-name: hand; transform-origin: -30px 196px; }
    .foot-a { animation-name: foot; transform-origin: -18px 219px; }
    .foot-b { animation-name: foot; animation-delay: -.15s; transform-origin: 20px 219px; }
    .notice { opacity: 0; animation-name: notice; }
    .beam { opacity: 0; animation-name: beam; }
    .packet { opacity: 0; animation-name: packet; }
    .celebrate { opacity: 0; animation-name: celebrate; }
    .progress { transform: scaleX(.04); transform-origin: 34px 298px; animation: progress 12s linear infinite; }
    @keyframes scan { 0%,22% {opacity:1} 24%,94% {opacity:0} 98%,100% {opacity:1} }
    @keyframes found { 0%,23% {opacity:0} 25%,42% {opacity:1} 44%,100% {opacity:0} }
    @keyframes patch { 0%,43% {opacity:0} 45%,66% {opacity:1} 68%,100% {opacity:0} }
    @keyframes pass { 0%,67% {opacity:0} 69%,92% {opacity:1} 96%,100% {opacity:0} }
    @keyframes cursor { 50% {opacity:0} }
    @keyframes bug { 0%,6% {transform:translate(760px,210px);opacity:0} 10% {opacity:1} 26%,44% {transform:translate(637px,210px);opacity:1} 53% {transform:translate(616px,204px);opacity:1} 57%,100% {transform:translate(616px,196px);opacity:0} }
    @keyframes legs { 50% {transform:translateY(2px)} }
    @keyframes engineer { 0%,29% {transform:translateX(519px)} 43%,70% {transform:translateX(478px)} 80%,100% {transform:translateX(519px)} }
    @keyframes breathe { 50% {transform:translateY(-2px)} }
    @keyframes blink { 0%,43%,47%,100% {transform:scaleY(1)} 45% {transform:scaleY(.12)} }
    @keyframes hand { 0%,42%,65%,100% {transform:rotate(0deg)} 46%,52%,58% {transform:rotate(-24deg)} 49%,55%,61% {transform:rotate(-9deg)} }
    @keyframes foot { 0%,30%,43%,70%,82%,100% {transform:rotate(0deg)} 33%,39%,74%,80% {transform:rotate(16deg)} 36%,77% {transform:rotate(-16deg)} }
    @keyframes notice { 0%,25% {opacity:0;transform:translateY(4px)} 28%,37% {opacity:1;transform:translateY(0)} 41%,100% {opacity:0;transform:translateY(-3px)} }
    @keyframes beam { 0%,47%,62%,100% {opacity:0} 50%,59% {opacity:1} }
    @keyframes packet { 0%,55% {opacity:0;transform:translateX(0)} 57% {opacity:1} 66% {opacity:1;transform:translateX(117px)} 68%,100% {opacity:0;transform:translateX(117px)} }
    @keyframes celebrate { 0%,69% {opacity:0;transform:translateY(5px)} 73%,85% {opacity:1;transform:translateY(0)} 92%,100% {opacity:0;transform:translateY(-5px)} }
    @keyframes progress { 0% {transform:scaleX(.04)} 92%,100% {transform:scaleX(1)} }
    @media (prefers-reduced-motion: reduce) {
      *, .cycle { animation: none !important; }
      .engineer { transform:translateX(519px); }
      .scan, .bug, .cursor { opacity:0; }
      .pass, .celebrate { opacity:1; }
      .progress { transform:scaleX(1); }
    }
  </style>
  <g clip-path="url(#bounds)">
    <rect width="840" height="320" fill="url(#bg)"/>
    <rect x="24" y="61" width="792" height="190" fill="url(#grid)"/>
    <ellipse cx="471" cy="186" rx="290" ry="153" fill="url(#light)"/>
    <path d="M0 49H840M0 271H840" stroke="#262b30"/>
    <circle cx="27" cy="25" r="3" fill="#d9bc85"/>
    <text x="42" y="29" fill="#dce1e5" font-size="11" letter-spacing="1.6">THE LITTLE PATCH LAB</text>
    <text x="811" y="29" text-anchor="end" class="label">lshdf / 001</text>

    <!-- 실험실 선반과 작은 장비 -->
    <path d="M651 105H777" stroke="#3a4148" stroke-width="2"/>
    <path d="M662 106V113M766 106V113" stroke="#293037" stroke-width="2"/>
    <rect x="674" y="78" width="8" height="26" rx="1" fill="#74776b"/>
    <rect x="684" y="72" width="7" height="32" rx="1" fill="#b69b73"/>
    <path d="M699 78l9 25" stroke="#626d79" stroke-width="7"/>
    <path d="M742 86v-8m0 8c-15-1-18-12-12-16 9 0 13 8 12 16m0-1c1-15 10-21 15-17 4 9-5 17-15 17" stroke="#738a75" stroke-width="2" fill="#51664f"/>
    <path d="M731 88h24l-4 16h-16z" fill="#978570"/>
    <ellipse cx="427" cy="234" rx="283" ry="12" fill="#000" opacity=".3"/>

    <!-- 모니터: 순환 상태와 실제 코드 패치 -->
    <rect x="147" y="84" width="277" height="139" rx="10" fill="url(#case)" stroke="#434a52"/>
    <rect x="155" y="92" width="261" height="121" rx="5" fill="#090d10" stroke="#171e23"/>
    <path d="M156 113H415" stroke="#20272c"/>
    <circle cx="166" cy="102" r="2" fill="#687078"/>
    <text x="176" y="106" fill="#717c86" font-size="9">patch-lab — sandbox</text>
    <text x="170" y="134" class="code" fill="#e1c694">$ test boundary</text>
    <g class="cycle scan">
      <text x="170" y="156" class="code">checking untrusted input</text>
      <text x="170" y="178" fill="#74838e" font-size="11">running assertions</text>
      <rect class="cursor" x="302" y="169" width="6" height="11" fill="#b5c2cc"/>
    </g>
    <g class="cycle found">
      <text x="170" y="156" fill="#e7ac88" font-size="12">FAIL  boundary escaped</text>
      <text x="170" y="178" fill="#77848e" font-size="11">1 unexpected visitor.</text>
      <circle cx="399" cy="102" r="2.5" fill="#e7ac88"/>
    </g>
    <g class="cycle patch" font-size="11">
      <rect x="164" y="143" width="242" height="20" rx="2" fill="#b87058" opacity=".1"/>
      <text x="170" y="157" fill="#d29a87">− trust(input)</text>
      <rect x="164" y="166" width="242" height="20" rx="2" fill="#7eb795" opacity=".12"/>
      <text x="170" y="180" fill="#a7cfb2">+ validate(input)</text>
    </g>
    <g class="cycle pass">
      <text x="170" y="156" fill="#abd1b6" font-size="12">PASS  boundary enforced</text>
      <text x="170" y="178" fill="#82958a" font-size="11">1 patched. 0 loose bugs.</text>
      <circle cx="399" cy="102" r="2.5" fill="#a7cfb2"/>
    </g>
    <path d="M134 223h303l15 10q0 5-9 5H128q-9 0-9-5z" fill="#262d33" stroke="#424a51"/>
    <path d="M261 224h52l-5 5h-42z" fill="#141a1f"/>
    <path d="M159 233h236" stroke="#606970" opacity=".45"/>

    <!-- 입력을 검사하는 격리 게이트 -->
    <path d="M582 231v-80q0-10 10-10h38q10 0 10 10v80" fill="none" stroke="#333d43" stroke-width="5"/>
    <path d="M582 230v-79q0-10 10-10h38q10 0 10 10v79" fill="none" stroke="#7f9d8d" stroke-opacity=".25"/>
    <text x="611" y="127" text-anchor="middle" class="label" font-size="8">BOUNDARY</text>
    <g class="cycle beam">
      <path d="M588 152h46v75h-46z" fill="#b9dfc6" opacity=".06"/>
      <path d="M588 190h46" stroke="#b6dec1" stroke-width="2"/>
      <path d="M588 185h46m-46 10h46" stroke="#b6dec1" opacity=".2"/>
    </g>
    <path d="M647 230h96" stroke="#3b454b" stroke-dasharray="2 5"/>
    <g class="cycle packet"><rect x="616" y="209" width="13" height="13" rx="3" fill="#a7cfb2"/><path d="m619 215 3 3 4-5" fill="none" stroke="#293d30" stroke-width="1.5"/></g>
    <rect x="739" y="184" width="34" height="49" rx="5" fill="#1e262b" stroke="#3c494f"/>
    <path d="M746 194h19m-19 7h19m-19 7h19" stroke="#556068" stroke-width="2"/>
    <circle cx="756" cy="220" r="2.5" fill="#65746b"/>
    <circle class="cycle pass" cx="756" cy="220" r="3" fill="#b1e0bd"/>

    <!-- 발걸음, 눈 깜빡임, 키보드 입력을 분리해 동작을 연결 -->
    <g class="cycle engineer" transform="translate(519 0)">
      <ellipse cx="0" cy="232" rx="43" ry="6" fill="#000" opacity=".4"/>
      <ellipse class="cycle foot-a" cx="-18" cy="223" rx="14" ry="7" fill="#d9af75" stroke="#a27848"/>
      <ellipse class="cycle foot-b" cx="20" cy="223" rx="14" ry="7" fill="#d9af75" stroke="#a27848"/>
      <g class="body">
        <path d="M-37 167c1-24 28-34 51-26 25 8 31 42 20 62-8 15-34 20-51 11-18-8-26-26-20-47z" fill="url(#skin)" stroke="#b18a56" stroke-width="1.5"/>
        <path d="M-24 158q7-11 22-11" fill="none" stroke="#ffedc8" stroke-width="5" stroke-linecap="round" opacity=".55"/>
        <g fill="#996b38" opacity=".45"><circle cx="24" cy="163" r="2"/><circle cx="-27" cy="188" r="1.8"/><circle cx="14" cy="207" r="2"/></g>
        <g class="eyes" fill="#31291f"><ellipse cx="-17" cy="176" rx="3.2" ry="5.3"/><ellipse cx="2" cy="176" rx="3.2" ry="5.3"/></g>
        <path d="M-14 190q6 6 12 0" fill="none" stroke="#493224" stroke-width="2" stroke-linecap="round"/>
        <ellipse cx="-27" cy="186" rx="5" ry="2.5" fill="#cc8b70" opacity=".45"/>
        <ellipse cx="12" cy="186" rx="5" ry="2.5" fill="#cc8b70" opacity=".45"/>
        <path d="M24 188q16 9 13 18" fill="none" stroke="#c9985b" stroke-width="8" stroke-linecap="round"/>
        <g class="cycle hand"><path d="M-30 195q-11 9-22 19" fill="none" stroke="#dfb579" stroke-width="10" stroke-linecap="round"/><path d="m-55 216-8 4" stroke="#efd29e" stroke-width="7" stroke-linecap="round"/></g>
      </g>
      <g class="cycle notice"><path d="M-3 118v-9m0 14v1" stroke="#e8c994" stroke-width="3" stroke-linecap="round"/><path d="m10 119 5-5m-29 5-5-5" stroke="#e8c994" stroke-width="1.5" stroke-linecap="round"/></g>
      <g class="cycle celebrate"><path d="m-9 121 6 6 12-14" fill="none" stroke="#b1d7ba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-24 111v5m-2.5-2.5h5m44 11v5m-2.5-2.5h5" stroke="#bba27a" stroke-width="1.2"/></g>
    </g>

    <g class="cycle bug" transform="translate(760 210)">
      <g class="legs" fill="none" stroke="#b5806c" stroke-width="2" stroke-linecap="round"><path d="m-7 2-7-4m7 9-8 3m22-8 7-4m-7 9 8 3"/></g>
      <rect x="-8" y="-3" width="16" height="19" rx="7" fill="#c29279"/>
      <path d="M0 0v13" stroke="#7e584b"/>
      <path d="m-5-2-3-5m13 5 3-5" stroke="#c29279" stroke-width="2" stroke-linecap="round"/>
      <circle cx="-3" cy="2" r="1.2" fill="#231f1c"/><circle cx="3" cy="2" r="1.2" fill="#231f1c"/>
    </g>

    <g class="label">
      <text x="27" y="290">01 OBSERVE</text><text x="277" y="290">02 PATCH</text><text x="539" y="290">03 VERIFY</text>
      <text x="812" y="290" text-anchor="end" fill="#b4bdc4">↻</text>
    </g>
    <path d="M34 298H806" stroke="#272f35" stroke-width="2"/>
    <path class="progress" d="M34 298H806" stroke="#bda887" stroke-width="2"/>
  </g>
  <rect x=".5" y=".5" width="839" height="319" rx="16" fill="none" stroke="#30363d"/>
</svg>
